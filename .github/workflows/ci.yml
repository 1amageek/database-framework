name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TOOLCHAINS: org.swift.64202608141a
  SWIFT_SNAPSHOT: swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a
  SWIFT_SNAPSHOT_URL: https://download.swift.org/swift-6.4.x-branch/xcode/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a-osx.pkg

jobs:
  benchmark-separation:
    name: Benchmark separation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify benchmark separation
        run: scripts/verify-benchmark-separation

  benchmark-build:
    name: Benchmark verification
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout framework
        uses: actions/checkout@v7
        with:
          path: database-framework

      - name: Checkout benchmark support
        uses: actions/checkout@v7
        with:
          repository: 1amageek/database-framework-benchmark
          path: database-framework-benchmark

      - name: Install pinned Swift toolchain
        run: |
          toolchain_package="$RUNNER_TEMP/${SWIFT_SNAPSHOT}-osx.pkg"
          toolchain_root="$HOME/Library/Developer/Toolchains/${SWIFT_SNAPSHOT}.xctoolchain"
          curl -fL --retry 3 -o "$toolchain_package" "$SWIFT_SNAPSHOT_URL"
          installer -pkg "$toolchain_package" -target CurrentUserHomeDirectory
          test -x "$toolchain_root/usr/bin/swift"
          platform_linker="$(env -u TOOLCHAINS xcrun --find ld)"
          ln -sf "$platform_linker" "$toolchain_root/usr/bin/ld"
          test -x "$toolchain_root/usr/bin/ld"
          echo "$toolchain_root/usr/bin" >> "$GITHUB_PATH"

      - name: Prepare pinned FoundationDB client
        run: |
          client_directory="$(database-framework/scripts/docker-test-harness foundationdb-client)"
          test -f "$client_directory/include/foundationdb/fdb_c.h"
          test -f "$client_directory/lib/libfdb_c.dylib"
          echo "FDB_CLIENT_INCLUDE_DIRECTORY=$client_directory/include" >> "$GITHUB_ENV"
          echo "FDB_CLIENT_LIBRARY_DIRECTORY=$client_directory/lib" >> "$GITHUB_ENV"

      - name: Validate benchmark median gate
        working-directory: database-framework
        run: scripts/test-benchmark-median-validator

      - name: Run bitmap regression benchmark
        working-directory: database-framework
        run: scripts/xcode-benchmark-harness bitmap --result-directory /tmp/database-framework-optimization-benchmarks/bitmap

      - name: Run full-text regression benchmark
        if: ${{ !cancelled() }}
        working-directory: database-framework
        run: scripts/xcode-benchmark-harness fulltext --result-directory /tmp/database-framework-optimization-benchmarks/fulltext

      - name: Build benchmark package without executing workloads
        if: ${{ !cancelled() }}
        working-directory: database-framework/Benchmarks
        run: |
          result_directory=/tmp/database-framework-benchmark-build
          result_bundle="$result_directory/FrameworkPerformanceBenchmarks.xcresult"
          log_path="$result_directory/FrameworkPerformanceBenchmarks.log"
          source_packages="$result_directory/SourcePackages"
          pinned_swiftc="$(xcrun --toolchain "$TOOLCHAINS" --find swiftc)"
          resolved_checksum_before="$(shasum -a 256 Package.resolved)"
          mkdir -p "$result_directory" "$source_packages"
          set -o pipefail
          perl -e 'alarm shift; exec @ARGV' 900 \
            env TOOLCHAINS=com.apple.dt.toolchain.XcodeDefault \
            xcodebuild build-for-testing \
              -scheme database-framework-benchmarks-Package \
              -destination 'platform=macOS,arch=arm64' \
              -derivedDataPath "$result_directory/DerivedData" \
              -clonedSourcePackagesDirPath "$source_packages" \
              -disablePackageRepositoryCache \
              -resultBundlePath "$result_bundle" \
              -enableCodeCoverage NO \
              -onlyUsePackageVersionsFromResolvedFile \
              -skipPackageUpdates \
              -skipMacroValidation \
              "HEADER_SEARCH_PATHS=\$(inherited) $FDB_CLIENT_INCLUDE_DIRECTORY" \
              "LIBRARY_SEARCH_PATHS=\$(inherited) $FDB_CLIENT_LIBRARY_DIRECTORY" \
              SWIFT_EXEC="$pinned_swiftc" \
              2>&1 | tee "$log_path"
          test "$resolved_checksum_before" = "$(shasum -a 256 Package.resolved)"
          grep -F "SWIFT_EXEC = $pinned_swiftc" "$log_path"

      - name: Validate benchmark build result
        if: ${{ !cancelled() }}
        run: |
          summary="$(xcrun xcresulttool get build-results \
            --path /tmp/database-framework-benchmark-build/FrameworkPerformanceBenchmarks.xcresult)"
          test "$(printf '%s' "$summary" | plutil -extract status raw -)" = succeeded
          test "$(printf '%s' "$summary" | plutil -extract errorCount raw -)" = 0
          test "$(printf '%s' "$summary" | plutil -extract warningCount raw -)" = 0
          test "$(printf '%s' "$summary" | plutil -extract analyzerWarningCount raw -)" = 0

      - name: Upload benchmark build results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-build-xcresult
          path: |
            /tmp/database-framework-benchmark-build
            /tmp/database-framework-optimization-benchmarks
          if-no-files-found: error

  docker-backends:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SQLite Linux (standard)
            command: sqlite
            arguments: ""
            artifact: sqlite-linux-standard
          - name: SQLite Linux (MultiBase)
            command: sqlite
            arguments: --multi-base
            artifact: sqlite-linux-multi-base
          - name: PostgreSQL Linux
            command: postgresql
            arguments: ""
            artifact: postgresql-linux
          - name: FoundationDB Linux
            command: foundationdb
            arguments: ""
            artifact: foundationdb-linux
    env:
      DATABASE_FRAMEWORK_DOCKER_RESULT_ROOT: /tmp/database-framework-docker-results
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore verified toolchain cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/database-framework/docker/downloads
            ~/.cache/database-framework/docker/swift
          key: database-framework-docker-arm64-${{ hashFiles('scripts/docker/versions.env') }}

      - name: Report Docker capability
        run: scripts/docker-test-harness doctor

      - name: Run backend verification
        timeout-minutes: 110
        run: scripts/docker-test-harness ${{ matrix.command }} ${{ matrix.arguments }}

      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/database-framework-docker-results
          if-no-files-found: error

  macos-sqlite-parity:
    name: SQLite macOS parity (${{ matrix.name }})
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: standard
            arguments: ""
            artifact: sqlite-macos-standard
          - name: MultiBase
            arguments: --multi-base
            artifact: sqlite-macos-multi-base
    env:
      DATABASE_FRAMEWORK_DOCKER_RESULT_ROOT: /tmp/database-framework-docker-results
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pinned Swift toolchain
        run: |
          toolchain_package="$RUNNER_TEMP/${SWIFT_SNAPSHOT}-osx.pkg"
          toolchain_root="$HOME/Library/Developer/Toolchains/${SWIFT_SNAPSHOT}.xctoolchain"
          curl -fL --retry 3 -o "$toolchain_package" "$SWIFT_SNAPSHOT_URL"
          installer -pkg "$toolchain_package" -target CurrentUserHomeDirectory
          test -x "$toolchain_root/usr/bin/swift"
          platform_linker="$(env -u TOOLCHAINS xcrun --find ld)"
          ln -sf "$platform_linker" "$toolchain_root/usr/bin/ld"
          test -x "$toolchain_root/usr/bin/ld"
          echo "$toolchain_root/usr/bin" >> "$GITHUB_PATH"

      - name: Report Swift version
        run: |
          swift --version
          xcrun --toolchain "$TOOLCHAINS" swiftc --version

      - name: Run SQLite parity verification
        timeout-minutes: 75
        run: scripts/docker-test-harness macos-sqlite ${{ matrix.arguments }}

      - name: Upload SQLite parity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: /tmp/database-framework-docker-results
          if-no-files-found: error
